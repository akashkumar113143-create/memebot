name: Build Jarvis Phone Voice V2 APK
on:
  push:
    branches: [jarvis-phone-build, jarvis-phone-safe-install, jarvis-phone-voice-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p jarvis-phone assembleDebug --stacktrace
      - name: Prepare direct-download APK
        run: cp jarvis-phone/app/build/outputs/apk/debug/app-debug.apk JarvisPhoneV2-Fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisPhoneVoiceV2-APK
          path: JarvisPhoneV2-Fixed.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/jarvis-phone-voice-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jarvis-v2-fixed >/dev/null 2>&1; then
            gh release upload jarvis-v2-fixed JarvisPhoneV2-Fixed.apk --clobber
          else
            gh release create jarvis-v2-fixed JarvisPhoneV2-Fixed.apk --title 'Jarvis Phone V2 Fixed' --notes 'Fixed Start Listening microphone foreground service, voice recognition behavior, and PhonePe/Paytm launch support.' --target "$GITHUB_SHA"
          fi

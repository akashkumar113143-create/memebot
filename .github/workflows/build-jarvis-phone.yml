name: Build Jarvis Phone Voice V2 APK
on:
  push:
    branches: [jarvis-phone-build, jarvis-phone-safe-install, jarvis-phone-voice-v2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p jarvis-phone assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisPhoneVoiceV2-APK
          path: jarvis-phone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
